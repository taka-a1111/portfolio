<!DOCTYPE html>
<html lang="ja">
<head>
<!-- BUILD_TAG: 2026-07-23e -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>送信完了｜インフォサクセス</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Cormorant+Garamond:ital,wght@1,500&display=swap" rel="stylesheet">
<style>
:root{--sumi:#1a1512;--ink-2:#57493f;--ink-3:#94867b;--paper:#faf6ef;--white:#fffdf9;--beni:#a92e51;--beni-wash:#f9e9ee;--kin:#a9812e;--line:#e6dccb;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Zen Kaku Gothic New',sans-serif;background:var(--paper);color:var(--sumi);min-height:100vh;display:flex;align-items:center;justify-content:center;padding:30px;overflow-x:hidden;line-height:1.9;}
.card{background:var(--white);border:1px solid var(--line);border-radius:0;box-shadow:none;border:1px solid #d9cdb9;max-width:560px;width:100%;padding:56px 48px;text-align:center;}
.mark{width:66px;height:66px;border-radius:0;background:var(--beni-wash);color:var(--beni);display:flex;align-items:center;justify-content:center;margin:0 auto 26px;}
.mark svg{width:30px;height:30px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.en{font-family:'Cormorant Garamond',serif;font-style:italic;font-size:14px;color:var(--kin);letter-spacing:.14em;}
h1{font-family:'Shippori Mincho',serif;font-size:26px;font-weight:700;letter-spacing:.05em;margin-top:10px;}
p{font-size:14px;color:var(--ink-2);margin-top:18px;}
a.back{display:inline-flex;align-items:center;gap:10px;margin-top:34px;background:var(--sumi);color:var(--paper);text-decoration:none;font-weight:700;font-size:14px;padding:14px 32px;border-radius:0;transition:background .3s,transform .3s;}
a.back:hover{background:var(--beni);transform:translateY(-2px);}
a.back svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.tag{font-size:10px;color:var(--ink-3);margin-top:30px;opacity:.6;}
@media(max-width:600px){.card{padding:42px 26px;}}
</style>
</head>
<body>
<div class="card">
  <div class="mark"><svg viewBox="0 0 24 24"><path d="M20 6L9 17l-5-5"/></svg></div>
  <div class="en">Thank You</div>
  <h1>送信が完了しました。</h1>
  <p>お問い合わせありがとうございます。<br>内容を確認のうえ、通常1営業日以内にご返信いたします。<br>しばらく経っても返信がない場合は、お手数ですが迷惑メールフォルダをご確認ください。</p>
  <a class="back" href="./index.html"><svg viewBox="0 0 24 24"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>トップページへ戻る</a>
  <div class="tag">build 2026-07-23e</div>
</div>
</body>
</html>
